name: Run snippets

# Every snippet on the site is executed against live data.lsdb.io catalogs.
# Scheduled rather than per-push: this hits the network, and a flaky catalog
# read should not block an unrelated CSS change.
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

jobs:
  snippets:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip lsdb lsdb-crossmatch astropy matplotlib
      - name: Check markup and badges
        run: python tests/check_markup.py
      - name: Run every runnable snippet
        run: python tests/run_snippets.py
